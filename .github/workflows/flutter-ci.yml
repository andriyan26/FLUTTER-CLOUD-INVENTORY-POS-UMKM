name: Flutter CI (Analyze, Test & Web Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Flutter Web Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter SDK (Stable + Cache)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install Dependencies
        run: flutter pub get

      - name: 4. Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: 5. Run Widget & Unit Tests
        run: flutter test

      - name: 6. Build Flutter Web (Release)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: 7. Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-release
          path: build/web
          retention-days: 7
